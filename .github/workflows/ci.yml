name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm install
      - run: npm run build
      - run: npm test

  # The GitHub Action exactly as an outside repository uses it: a fresh checkout with nothing built.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: done
        uses: ./packages/core/action
        with: { base: origin/main, mode: report }
      - run: test -n "${{ steps.done.outputs.state }}" || grep -q "not set up" "$GITHUB_STEP_SUMMARY"
