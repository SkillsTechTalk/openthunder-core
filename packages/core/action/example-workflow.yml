# Example: .github/workflows/definition-of-done.yml
name: Definition of Done
on: pull_request
jobs:
  done:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # the policy is read from the base branch
      - run: npm ci && npx vitest run --reporter=junit --outputFile=junit.xml --coverage --coverage.reporter=lcov
      # Pin to a commit of https://github.com/SkillsTechTalk/openthunder-core (there are no release tags yet).
      - uses: SkillsTechTalk/openthunder-core/packages/core/action@<commit-sha>
        with:
          junit: junit.xml
          lcov: coverage/lcov.info
          # openapi: openapi.yaml            # optional: compare the API description with the base branch
          mode: report                      # switch to enforce once the team trusts it
          # signing-key: ${{ secrets.DONE_CORE_SIGNING_KEY }}   # optional; makes the receipts trusted CI evidence
