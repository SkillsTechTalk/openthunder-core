<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">How OpenThunder Core works</title>
  <desc id="d">Step 1: your tools' reports become evidence for this exact commit. Step 2: your team's rules, read from the main branch. Step 3: one answer, Done, Done with exceptions, or Not done, with the reason and next step for every item.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#080B12"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3B82F6"/></marker>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="459" rx="24" fill="none" stroke="#1E293B"/>

  <!-- column 1 -->
  <g transform="translate(48 48)">
    <circle cx="18" cy="18" r="18" fill="#3B82F6"/><text x="18" y="25" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#fff">1</text>
    <text x="50" y="16" class="sans" font-size="22" font-weight="700" fill="#F8FAFC">Your evidence</text>
    <text x="50" y="40" class="sans" font-size="15" fill="#94A3B8">reports your tools already write</text>
    <rect y="64" width="340" height="300" rx="16" fill="#101622" stroke="#1E293B"/>
    <g class="mono" font-size="16">
      <g transform="translate(24 96)"><rect width="292" height="44" rx="10" fill="#182131"/><text x="16" y="28" fill="#E2E8F0">JUnit</text><text x="276" y="28" text-anchor="end" fill="#94A3B8">tests</text></g>
      <g transform="translate(24 150)"><rect width="292" height="44" rx="10" fill="#182131"/><text x="16" y="28" fill="#E2E8F0">lcov</text><text x="276" y="28" text-anchor="end" fill="#94A3B8">coverage</text></g>
      <g transform="translate(24 204)"><rect width="292" height="44" rx="10" fill="#182131"/><text x="16" y="28" fill="#E2E8F0">SARIF</text><text x="276" y="28" text-anchor="end" fill="#94A3B8">security</text></g>
      <g transform="translate(24 258)"><rect width="292" height="44" rx="10" fill="#182131"/><text x="16" y="28" fill="#E2E8F0">OpenAPI</text><text x="276" y="28" text-anchor="end" fill="#94A3B8">API breaks</text></g>
    </g>
    <text x="170" y="344" text-anchor="middle" class="sans" font-size="14" fill="#94A3B8">bound to the exact commit; can be signed in CI</text>
  </g>

  <path d="M404 262h56" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- column 2 -->
  <g transform="translate(472 48)">
    <circle cx="18" cy="18" r="18" fill="#3B82F6"/><text x="18" y="25" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#fff">2</text>
    <text x="50" y="16" class="sans" font-size="22" font-weight="700" fill="#F8FAFC">Your rules</text>
    <text x="50" y="40" class="sans" font-size="15" fill="#94A3B8">one small file, read from main</text>
    <rect y="64" width="340" height="300" rx="16" fill="#101622" stroke="#1E293B"/>
    <text x="24" y="100" class="mono" font-size="14" fill="#94A3B8">.openthunder/done.yml</text>
    <g class="mono" font-size="17">
      <text x="24" y="140" fill="#7C9CFF">require:</text>
      <text x="44" y="172" fill="#E2E8F0">- tests</text>
      <text x="44" y="204" fill="#E2E8F0">- coverage: <tspan fill="#F59E0B">{ min: 80 }</tspan></text>
      <text x="44" y="236" fill="#E2E8F0">- security</text>
      <text x="44" y="268" fill="#E2E8F0">- check: openapi-compat</text>
    </g>
    <text x="170" y="344" text-anchor="middle" class="sans" font-size="14" fill="#94A3B8">a change can't loosen the rules that judge it</text>
  </g>

  <path d="M828 262h56" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- column 3 -->
  <g transform="translate(896 48)">
    <circle cx="18" cy="18" r="18" fill="#3B82F6"/><text x="18" y="25" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#fff">3</text>
    <text x="50" y="16" class="sans" font-size="22" font-weight="700" fill="#F8FAFC">One answer</text>
    <text x="50" y="40" class="sans" font-size="15" fill="#94A3B8">with the reason for every item</text>
    <rect y="64" width="336" height="300" rx="16" fill="#101622" stroke="#1E293B"/>
    <g class="sans" font-size="18" font-weight="700">
      <g transform="translate(24 96)"><rect width="288" height="52" rx="12" fill="#22C55E" fill-opacity=".12" stroke="#22C55E"/><text x="144" y="33" text-anchor="middle" fill="#22C55E">Done</text></g>
      <g transform="translate(24 160)"><rect width="288" height="52" rx="12" fill="#F59E0B" fill-opacity=".10" stroke="#F59E0B" stroke-dasharray="6 4"/><text x="144" y="33" text-anchor="middle" fill="#FBBF24">Done with exceptions</text></g>
      <g transform="translate(24 224)"><rect width="288" height="52" rx="12" fill="#EF4444" fill-opacity=".10" stroke="#EF4444"/><text x="144" y="33" text-anchor="middle" fill="#F87171">Not done + next step</text></g>
    </g>
    <text x="168" y="318" text-anchor="middle" class="sans" font-size="14" fill="#CBD5E1">No evidence is never a pass.</text>
    <text x="168" y="344" text-anchor="middle" class="sans" font-size="14" fill="#94A3B8">Old evidence never approves new code.</text>
  </g>

  <text x="640" y="440" text-anchor="middle" class="sans" font-size="15" fill="#64748B">Runs locally, in GitHub Actions, and in VS Code. No account, no AI key, no network.</text>
</svg>
